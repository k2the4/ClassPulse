name: Fix Subject Analysis Layout

on:
  push:
    branches:
      - ui/subject-analysis-at-risk-layout

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix subject analysis combined table layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/subject-analysis-at-risk-layout
          fetch-depth: 0

      - name: Apply layout fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('pages/subject-analysis/[subjectId]/academic.tsx')
          s = path.read_text(encoding='utf-8')

          # Remove the duplicate Combined Performance Tiers panel. The chart already
          # provides the tier filtering, so this panel only wastes vertical space.
          s, n = re.subn(
              r'\n\s*<section className="analysis-panel combined-tier-panel">.*?</section>(?=\n\s*<div className="academic-rank-grid">)',
              '',
              s,
              flags=re.S,
          )
          assert n == 1, f'Expected 1 combined tier panel removal, got {n}'

          # Move the two Combined sorting controls into the table panel so the table
          # owns its sorting UI and the controls no longer consume a separate row.
          controls = '''<div className="combined-controls-inline">
                    <div className="combined-control"><label htmlFor="combined-sort-field">Grade / Sort By</label><select id="combined-sort-field" value={combinedSort} onChange={(e) => setCombinedSort(e.target.value as CombinedSort)}><option value="combined">Combined (average)</option><option value="midsem1">Midsem 1</option><option value="midsem2">Midsem 2</option><option value="max">Maximum score</option></select></div>
                    <div className="combined-control"><label htmlFor="combined-sort-order">Order</label><select id="combined-sort-order" value={sortOrder} onChange={(e) => setSortOrder(e.target.value as SortOrder)}><option value="desc">High to Low</option><option value="asc">Low to High</option><option value="none">No Sort</option></select></div>
                  </div>'''
          old_controls = re.escape('''          <section className="combined-controls-bar"><div className="combined-control"><label htmlFor="combined-sort-field">Grade / Sort By</label><select id="combined-sort-field" value={combinedSort} onChange={(e) => setCombinedSort(e.target.value as CombinedSort)}><option value="combined">Combined (average)</option><option value="midsem1">Midsem 1</option><option value="midsem2">Midsem 2</option><option value="max">Maximum score</option></select></div><div className="combined-control"><label htmlFor="combined-sort-order">Order</label><select id="combined-sort-order" value={sortOrder} onChange={(e) => setSortOrder(e.target.value as SortOrder)}><option value="desc">High to Low</option><option value="asc">Low to High</option><option value="none">No Sort</option></select></div></section>
''')
          s, n = re.subn(old_controls, '', s, count=1)
          assert n == 1, f'Expected external combined controls removal, got {n}'

          marker = '''              <div className="analysis-panel-head"><div><h3>All Students</h3><p style={{ marginTop: 4, color: "#98a2b3", fontSize: 11 }}>{selectedTier ? `Filtered: ${selectedTier}` : "Combined Midsem results"}</p></div><div style={{ display: "flex", alignItems: "center", gap: 8 }}>{selectedTier && <button className="analysis-secondary" style={{ padding: "5px 8px" }} onClick={() => setSelectedTier(null)}><X size={13} />Clear</button>}<span className="analysis-count">{sortedCombinedRows.length} Students</span></div></div>'''
          assert marker in s, 'Combined table header marker not found'
          s = s.replace(marker, marker + '\n' + controls, 1)

          # The previous width allocation totaled 110%, which mathematically forced
          # horizontal scrolling. Use a fixed layout totaling exactly 100%.
          replacements = {
              '.combined-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(360px, .95fr); gap: 16px; align-items: start; }':
              '.combined-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(320px, .85fr); gap: 16px; align-items: start; }',
              '.combined-table-wrap { min-height: 560px; max-height: 560px; }':
              '.combined-table-wrap { min-height: 560px; max-height: 560px; overflow-x: hidden; overflow-y: auto; }',
              '.combined-table-panel .analysis-table { table-layout: fixed; }':
              '.combined-table-panel .analysis-table { table-layout: fixed; width: 100%; min-width: 0 !important; }',
              '.combined-table-panel .analysis-table th, .combined-table-panel .analysis-table td { white-space: nowrap; }':
              '.combined-table-panel .analysis-table th, .combined-table-panel .analysis-table td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }',
              '.combined-table-panel .analysis-table th:nth-child(1), .combined-table-panel .analysis-table td:nth-child(1) { width: 8%; }':
              '.combined-table-panel .analysis-table th:nth-child(1), .combined-table-panel .analysis-table td:nth-child(1) { width: 7%; }',
              '.combined-table-panel .analysis-table th:nth-child(2), .combined-table-panel .analysis-table td:nth-child(2) { width: 25%; }':
              '.combined-table-panel .analysis-table th:nth-child(2), .combined-table-panel .analysis-table td:nth-child(2) { width: 24%; }',
              '.combined-table-panel .analysis-table th:nth-child(3), .combined-table-panel .analysis-table td:nth-child(3) { width: 17%; }':
              '.combined-table-panel .analysis-table th:nth-child(3), .combined-table-panel .analysis-table td:nth-child(3) { width: 16%; }',
              '.combined-table-panel .analysis-table th:nth-child(4), .combined-table-panel .analysis-table td:nth-child(4), .combined-table-panel .analysis-table th:nth-child(5), .combined-table-panel .analysis-table td:nth-child(5), .combined-table-panel .analysis-table th:nth-child(6), .combined-table-panel .analysis-table td:nth-child(6), .combined-table-panel .analysis-table th:nth-child(7), .combined-table-panel .analysis-table td:nth-child(7) { width: 10%; }':
              '.combined-table-panel .analysis-table th:nth-child(4), .combined-table-panel .analysis-table td:nth-child(4), .combined-table-panel .analysis-table th:nth-child(5), .combined-table-panel .analysis-table td:nth-child(5), .combined-table-panel .analysis-table th:nth-child(6), .combined-table-panel .analysis-table td:nth-child(6), .combined-table-panel .analysis-table th:nth-child(7), .combined-table-panel .analysis-table td:nth-child(7) { width: 9%; }',
              '.combined-table-panel .analysis-table th:nth-child(8), .combined-table-panel .analysis-table td:nth-child(8) { width: 10%; }':
              '.combined-table-panel .analysis-table th:nth-child(8), .combined-table-panel .analysis-table td:nth-child(8) { width: 8%; }',
              '        .combined-tier-panel { padding: 18px; }\n':
              '',
              '        @media (max-width: 800px) { .combined-controls-bar { justify-content: flex-start; } .combined-layout, .summary-main-grid { grid-template-columns: 1fr; } .combined-right-column, .summary-metric-grid, .summary-filter-grid { grid-template-columns: 1fr; } .combined-control { min-width: 0; flex: 1; } .combined-table-wrap, .summary-table-wrap { min-height: 480px; max-height: 480px; } .academic-student-table { min-width: 760px; } }':
              '        @media (max-width: 800px) { .combined-layout, .summary-main-grid { grid-template-columns: 1fr; } .combined-right-column, .summary-metric-grid, .summary-filter-grid { grid-template-columns: 1fr; } .combined-control { min-width: 0; flex: 1; } .combined-controls-inline { flex-direction: column; } .combined-table-wrap, .summary-table-wrap { min-height: 480px; max-height: 480px; } }',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected source text: {old[:100]}')
              s = s.replace(old, new, 1)

          # Inline sorting controls styling.
          anchor = '        .combined-control { min-width: 190px; }\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '        .combined-controls-inline { display: flex; justify-content: flex-end; gap: 10px; padding: 0 0 12px; }\n', 1)

          path.write_text(s, encoding='utf-8', newline='\n')
          print('Applied combined table layout fixes')
          PY

      - name: Validate source
        run: |
          test ! $(grep -c 'combined-tier-panel' 'pages/subject-analysis/[subjectId]/academic.tsx')
          grep -q 'combined-controls-inline' 'pages/subject-analysis/[subjectId]/academic.tsx'
          grep -q 'min-width: 0 !important' 'pages/subject-analysis/[subjectId]/academic.tsx'
          ! grep -q 'academic-student-table { min-width: 760px; }' 'pages/subject-analysis/[subjectId]/academic.tsx'

      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/subject-analysis/'[subjectId]'/academic.tsx
          git commit -m 'Fix subject analysis combined table layout'
          git push origin HEAD:ui/subject-analysis-at-risk-layout

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-subject-analysis-layout.yml
          git commit -m 'Remove temporary subject analysis fix workflow'
          git push origin HEAD:ui/subject-analysis-at-risk-layout
